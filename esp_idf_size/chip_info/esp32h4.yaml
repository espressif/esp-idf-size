# Data_type:
#   primary_address: value
#   length: value or equation
#   secondary_address: value if exist
DRAM:
  primary_address: 0x40808000
  length: 0x60000
  secondary_address: 0x40808000
  name: DIRAM
CACHE_I:
  primary_address: 0x42000000
  length: 0x2000000
  name: Flash
# EXT_RAM shares its address window with the flash entries above. A memory region is
# assigned to the first memory type whose window contains it, see _split_memory_regions()
# in memorymap.py, so this entry has to stay after the flash ones. Output sections are
# routed here by name instead, see EXT_RAM_SECTION_NAMES. As a consequence the external
# RAM linker region is accounted as flash and this memory type has no total size, not
# even with the --use-linker-sizes option.
EXT_RAM:
  primary_address: 0x42000000
  length: 0x2000000
  name: External RAM
